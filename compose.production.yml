services:
    hs-core-api:
        image: ${CORE_IMAGE:?}
        pull_policy: always
        restart: unless-stopped
        mem_limit: 1536m
        environment:
            HOMESPACE_TIME_SIMULATED_AT: ${HOMESPACE_TIME_SIMULATED_AT?}
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
            GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?}
