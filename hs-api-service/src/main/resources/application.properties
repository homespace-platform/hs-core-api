# ===============================================================
# CORE APPLICATION
# ===============================================================
server.port=8081
spring.application.name=hs-core-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.output.ansi.enabled=ALWAYS
spring.main.banner-mode=off
spring.threads.virtual.enabled=true

# ===============================================================
# EUREKA SERVER
# ===============================================================
spring.cloud.discovery.enabled=true
eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL}
eureka.instance.prefer-ip-address=true

# ===============================================================
# INFRASTRUCTURE & DATA
# ===============================================================
## SQL
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
## NoSQL
spring.mongodb.uri=${MONGODB_URI}
## Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2s
## JSON Format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
## Kafka
spring.kafka.topic.keycloak-user-events=keycloak-user-events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
### Keycloak
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.admin.user-name=${KEYCLOAK_ADMIN_USERNAME}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.current-realm=${KEYCLOAK_CURRENT_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}

# ===============================================================
# BOOTSTRAP DATA
# ===============================================================
homespace.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED}
homespace.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME}
homespace.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL}
homespace.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
homespace.bootstrap.admin.phone-number=${BOOTSTRAP_ADMIN_PHONE_NUMBER}
homespace.bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME}
homespace.bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME}

# ===============================================================
# AWS S3 (storage service + listing media upload)
# ===============================================================
storage.s3.bucket=${AWS_S3_BUCKET}
storage.s3.region=${AWS_REGION}
storage.s3.upload-url-duration=${STORAGE_S3_UPLOAD_URL_DURATION}
storage.s3.download-url-duration=${STORAGE_S3_DOWNLOAD_URL_DURATION}

# ===============================================================
# LISTING PUBLICATION & SCHEDULED JOBS
# ===============================================================
## Số ngày hiển thị của bài đăng (mặc định 30 ngày)
listing.publication-duration-days=30

## 1. Quét tin đăng hết hạn (chuyển PUBLISHED quá hạn -> EXPIRED) - Chạy mỗi 60 giây (60.000 ms)
listing.expiration-check-delay-ms=60000

## 2. Quét dọn dẹp lịch sử xem tin quá 30 ngày - Chạy định kỳ lúc 03:00 sáng mỗi ngày
listing.view-history-cleanup-cron=0 0 3 * * ?

## 3. Quét vòng đời lịch hẹn xem nhà (PENDING quá hạn -> EXPIRED, CONFIRMED quá hạn -> COMPLETED) - Chạy mỗi 15 phút
listing.appointment-cleanup-cron=0 */15 * * * ?

# ===============================================================
# NOTIFICATION & OTP
# ===============================================================
notification.otp.length=${NOTIFICATION_OTP_LENGTH}
notification.otp.ttl=${NOTIFICATION_OTP_TTL}
notification.otp.resend-cooldown=${NOTIFICATION_OTP_RESEND_COOLDOWN}
notification.otp.max-attempts=${NOTIFICATION_OTP_MAX_ATTEMPTS}
notification.otp.max-sends-per-hour=${NOTIFICATION_OTP_MAX_SENDS_PER_HOUR}
notification.otp.hash-secret=${OTP_HASH_SECRET}

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notification.mail.from=${SMTP_FROM}
notification.mail.from-name=${SMTP_FROM_NAME}

# ===============================================================
# OBSERVABILITY
# ===============================================================
## Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
## Logging
logging.level.root=INFO
## Dev Tools
SPRING_DEVTOOLS_ADD_PROPERTIES=false
SPRING_DEVTOOLS_RESTART_ENABLED=false
SPRING_DEVTOOLS_LIVERELOAD_ENABLED=false
