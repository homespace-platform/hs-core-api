# ===============================================================
# BUSINESS CLOCK
# ===============================================================
# Đồng hồ nghiệp vụ: để trống dùng giờ thực; chỉ giả lập ở profile dev/test.
# Giá trị không có múi giờ dùng giờ Việt Nam.
homespace.time.simulated-at=${HOMESPACE_TIME_SIMULATED_AT:}

spring.config.import=optional:file:./.env[.properties]

# ===============================================================
# CORE APPLICATION
# ===============================================================
server.port=8081
server.forward-headers-strategy=framework
spring.application.name=hs-core-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.output.ansi.enabled=ALWAYS
spring.main.banner-mode=off
spring.threads.virtual.enabled=true
# Shared with hs-gateway-server; proves X-User-* headers and /internal/** calls come from the Gateway.
homespace.gateway.internal-secret=${GATEWAY_INTERNAL_SECRET}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.resolve-lazily=true

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===============================================================
# EUREKA
# ===============================================================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL}
spring.cloud.discovery.enabled=${SPRING_CLOUD_DISCOVERY_ENABLED}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
eureka.instance.prefer-ip-address=true

# ===============================================================
# POSTGRESQL
# ===============================================================
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================================================
# REDIS
# ===============================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2s

# ===============================================================
# KAFKA & NOTIFICATION OUTBOX
# ===============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.topic.keycloak-user-events=keycloak-user-events
spring.kafka.topic.news-events=${KAFKA_NEWS_TOPIC}
spring.kafka.topic.news-events-dlt=${KAFKA_NEWS_DLT_TOPIC}
spring.kafka.topic.chat-profile=${KAFKA_CHAT_PROFILE_TOPIC}
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# Appointment notifications: persisted with the booking, published after commit.
notification.events-topic=${KAFKA_EVENTS_TOPIC}
notification.outbox.enabled=${NOTIFICATION_OUTBOX_ENABLED}
notification.outbox.poll-delay-ms=${NOTIFICATION_OUTBOX_POLL_DELAY_MS}

# ===============================================================
# KEYCLOAK
# ===============================================================
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.admin.user-name=${KEYCLOAK_ADMIN_USERNAME}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.current-realm=${KEYCLOAK_CURRENT_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}

# ===============================================================
# BOOTSTRAP ADMINS
# ===============================================================
homespace.bootstrap.admins[0].enabled=true
homespace.bootstrap.admins[0].username=${BOOTSTRAP_ADMIN_USERNAME}
homespace.bootstrap.admins[0].email=${BOOTSTRAP_ADMIN_EMAIL}
homespace.bootstrap.admins[0].password=${BOOTSTRAP_ADMIN_PASSWORD}
homespace.bootstrap.admins[0].phone-number=${BOOTSTRAP_ADMIN_PHONE_NUMBER}
homespace.bootstrap.admins[0].first-name=${BOOTSTRAP_ADMIN_FIRST_NAME}
homespace.bootstrap.admins[0].last-name=${BOOTSTRAP_ADMIN_LAST_NAME}

homespace.bootstrap.admins[1].enabled=true
homespace.bootstrap.admins[1].username=${BOOTSTRAP_ADMIN_USERNAME_2}
homespace.bootstrap.admins[1].email=${BOOTSTRAP_ADMIN_EMAIL_2}
homespace.bootstrap.admins[1].password=${BOOTSTRAP_ADMIN_PASSWORD_2}
homespace.bootstrap.admins[1].phone-number=${BOOTSTRAP_ADMIN_PHONE_NUMBER_2}
homespace.bootstrap.admins[1].first-name=${BOOTSTRAP_ADMIN_FIRST_NAME_2}
homespace.bootstrap.admins[1].last-name=${BOOTSTRAP_ADMIN_LAST_NAME_2}

# ===============================================================
# ENCRYPTION (bank account + KYC)
# ===============================================================
homespace.security.encryption-key=${HOMESPACE_ENCRYPTION_KEY}
# Optional (only set while rotating the key): the one intentional default, blank means no rotation
homespace.security.previous-encryption-key=${HOMESPACE_ENCRYPTION_KEY_PREVIOUS:}

# ===============================================================
# AWS S3 (storage service + listing media upload)
# ===============================================================
storage.s3.bucket=${AWS_S3_BUCKET}
storage.s3.region=${AWS_REGION}
storage.s3.access-key=${AWS_ACCESS_KEY_ID}
storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
storage.s3.upload-url-duration=10m
storage.s3.download-url-duration=5m

# ===============================================================
# MAP & NEARBY
# ===============================================================
vietmap.api-key=${VIETMAP_API_KEY}

# Nearby: business/operating settings are explicit here; only the secret key comes from .env.
# These properties are required: Java contains no fallback configuration values.
nearby.tomtom.api-key=${TOMTOM_API_KEY}
nearby.sync-enabled=true
nearby.query-enabled=true
nearby.tomtom.license-approved=true
# HomeSpace's internal policy version/reference. This is not an ID issued by TomTom or proof of entitlement.
nearby.tomtom.license-policy-id=homespace-tomtom-poi-v1
nearby.tomtom.base-url=https://api.tomtom.com
nearby.tomtom.category-set=7372,7377,7321,7326,7332005,9361009,7315,7328,9942002,9362
nearby.tomtom.result-limit=100
nearby.default-radius-m=2000
nearby.scan-radius-m=2000
nearby.public-page-size=5
# Response deduplication: nearby entrances, or a named campus/hospital with multiple frontages.
nearby.dedup.same-place-radius-m=30
nearby.dedup.institution-radius-m=300
nearby.dedup.minimum-name-similarity=0.96
nearby.max-radius-m=5000
# 0 keeps the collected snapshot until the listing's location changes; no timed refresh/purge.
nearby.retention-hours=0
nearby.max-attempts=4
nearby.requests-per-minute=40
nearby.requests-per-day=2000
nearby.requests-per-month=20000
nearby.poll-delay-ms=5000
nearby.purge-delay-ms=3600000

# ===============================================================
# PAYMENT
# ===============================================================
homespace.payment.proof-upload.public-base-url=${PAYMENT_PROOF_UPLOAD_PUBLIC_BASE_URL}
homespace.payment.vietqr.banks-url=${PAYMENT_VIETQR_BANKS_URL}
homespace.payment.vietqr.banks-cache-ttl=${PAYMENT_VIETQR_BANKS_CACHE_TTL}
homespace.payment.confirmation-window-hours=24
homespace.payment.contract-due-hours=48

# SePay
homespace.membership.sepay.merchant-id=${PAYMENT_SEPAY_MERCHANT_ID}
homespace.membership.sepay.secret-key=${PAYMENT_SEPAY_SECRET_KEY}
homespace.membership.sepay.checkout-url=${PAYMENT_SEPAY_CHECKOUT_URL}
homespace.membership.sepay.return-url=${PAYMENT_SEPAY_RETURN_URL}
homespace.membership.sepay.ipn-secret=${PAYMENT_SEPAY_IPN_SECRET}

# ETH payment (Sepolia)
homespace.eth-payment.rpc-url=${PAYMENT_ETH_RPC_URL}
homespace.eth-payment.contract-address=${PAYMENT_ETH_CONTRACT_ADDRESS}
homespace.eth-payment.quote-signer-private-key=${PAYMENT_ETH_QUOTE_SIGNER_PRIVATE_KEY}
homespace.eth-payment.recipient-address=${PAYMENT_ETH_RECIPIENT_ADDRESS}
homespace.eth-payment.confirmations=3

# ===============================================================
# CONTRACT: GOTENBERG PDF, SMARTCA SIGNATURE, BLOCKCHAIN PROOF
# ===============================================================
contract.gotenberg.url=${CONTRACT_GOTENBERG_URL}
contract.gotenberg.enabled=true

homespace.smartca.enabled=true
homespace.smartca.base-url=${SMARTCA_BASE_URL}
homespace.smartca.sp-id=${SMARTCA_SP_ID}
homespace.smartca.sp-password=${SMARTCA_SP_PASSWORD}
homespace.smartca.connect-timeout=5s
homespace.smartca.read-timeout=30s
homespace.smartca.poll-interval=5000
homespace.smartca.embedding-delay-ms=5000
homespace.smartca.transaction-timeout=5m
homespace.smartca.webhook-enabled=false
homespace.smartca.webhook-public-url=${SMARTCA_WEBHOOK_PUBLIC_URL:}
homespace.smartca.pdf.signature-reason=Ky hop dong thue tren HomeSpace
homespace.smartca.pdf.signature-location=Viet Nam
# INTERNAL (legacy) | SMARTCA (VNPT SmartCA)
homespace.signature.mode=SMARTCA

# Blockchain proof của PDF cuối; cấu hình và khóa chỉ lấy từ môi trường.
homespace.blockchain.enabled=${CONTRACT_DOCUMENT_REGISTRY_ENABLED}
homespace.blockchain.rpc-url=${CONTRACT_DOCUMENT_REGISTRY_RPC_URL}
homespace.blockchain.registry-address=${CONTRACT_DOCUMENT_REGISTRY_ADDRESS}
homespace.blockchain.private-key=${CONTRACT_DOCUMENT_REGISTRY_OWNER_PRIVATE_KEY}
homespace.blockchain.chain-id=11155111
homespace.blockchain.poll-delay-ms=10000
homespace.blockchain.rpc-timeout-seconds=15
homespace.blockchain.retry-delay-seconds=30

# ===============================================================
# VNPT eKYC
# ===============================================================
vnpt.ekyc.enabled=${VNPT_EKYC_ENABLED}
vnpt.ekyc.base-url=${VNPT_EKYC_BASE_URL}
vnpt.ekyc.client-id=${VNPT_EKYC_CLIENT_ID}
vnpt.ekyc.client-secret=${VNPT_EKYC_CLIENT_SECRET}

# ===============================================================
# LISTING PUBLICATION & SCHEDULED JOBS
# ===============================================================
## Số ngày hiển thị của bài đăng (mặc định 30 ngày)
listing.publication-duration-days=30
## 1. Quét tin đăng hết hạn (chuyển PUBLISHED quá hạn -> EXPIRED) - Chạy mỗi 60 giây (60.000 ms)
listing.expiration-check-delay-ms=60000
## 2. Quét dọn dẹp lịch sử xem tin quá 30 ngày - Chạy định kỳ lúc 03:00 sáng mỗi ngày
listing.view-history-cleanup-cron=0 0 3 * * ?
## 3. Quét vòng đời lịch hẹn xem nhà (PENDING quá hạn -> EXPIRED, CONFIRMED quá hạn -> COMPLETED) - Chạy mỗi 15 phút
listing.appointment-cleanup-cron=0 */15 * * * ?
## 4. Danh mục field cho AI tìm phòng (tiện ích, nội thất, chính sách) đọc từ DB; cache theo giây, bắt buộc khai báo
listing.ai.catalog-cache-seconds=300
# Optional boundary pool: widen only the rent ceiling by <=500k; AI evaluates all other facts in context.
listing.ai.value.max-extra-monthly=500000
listing.ai.value.candidate-limit=8

# ===============================================================
# RENTAL REQUEST & HOLD RESERVATION
# ===============================================================
## Thời gian giữ chỗ sau khi chủ nhà duyệt yêu cầu thuê (phút) — dev/test: 60; production có thể tăng
rental.hold-duration-minutes=60
# Independent onboarding deadlines (business clock, Vietnam timezone).
rental.response-hours=24
rental.start-change-response-hours=24
rental.first-rent-window-hours=24
## Quét giải phóng tin đăng hết hạn giữ chỗ (ACCEPTED quá hạn -> EXPIRED & RESERVED -> PUBLISHED) - mỗi 30 giây
rental.expiration-check-delay-ms=30000
# Window starts after the verified landlord signature on the separate deposit PDF.
rental.deposit-signing-hours=48

# ===============================================================
# CONTRACT BILLING & SETTLEMENT JOBS
# ===============================================================
# Final notice before manual cancellation/retention; backend enforces at least 24 hours.
rental.default-response-hours=24
# Đồng bộ hóa đơn/vòng đời hợp đồng mỗi 60 giây (ms).
homespace.billing.sync-delay-ms=60000
# Hạn chủ nhà phản hồi yêu cầu gia hạn thanh toán (giờ).
homespace.billing.extension-response-hours=48
# Hạn phản hồi đề xuất/khiếu nại cọc (giờ); quá hạn chỉ đánh dấu cần xử lý.
homespace.closure.response-hours=48
homespace.complaint.response-hours=48
rental.resolution-response-hours=48
# Phụ lục điều chỉnh: hạn phản hồi và ký đủ hai bên (giờ), luôn trước ngày chốt kỳ áp dụng.
homespace.amendment.response-hours=48
homespace.amendment.signing-hours=48

# ===============================================================
# OBSERVABILITY
# ===============================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.level.root=INFO
SPRING_DEVTOOLS_ADD_PROPERTIES=false
SPRING_DEVTOOLS_RESTART_ENABLED=false
SPRING_DEVTOOLS_LIVERELOAD_ENABLED=false
