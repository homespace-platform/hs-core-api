# ===============================================================
# CORE APPLICATION
# ===============================================================
server.port=8081
spring.application.name=hs-core-api
spring.output.ansi.enabled=ALWAYS
spring.main.banner-mode=off
spring.threads.virtual.enabled=true

# ===============================================================
# EUREKA SERVER
# ===============================================================
eureka.client.enabled=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ===============================================================
# INFRASTRUCTURE & DATA
# ===============================================================
## SQL
spring.datasource.url=jdbc:postgresql://localhost:5432/homespace_core
spring.datasource.username=homespace
spring.datasource.password=homespace123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
## JSON Format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
## Kafka
spring.kafka.topic.keycloak-user-events=keycloak-user-events
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
### Keycloak
keycloak.server-url=http://localhost:9000
keycloak.admin.user-name=homespace
keycloak.admin.password=homespace123
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.current-realm=homespace-platform
keycloak.client-id=homespace-id

# ===============================================================
# AWS S3 STORAGE
# Credentials are resolved by the AWS default credential provider chain.
# Local: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY environment variables.
# Production: use an IAM role instead of long-lived access keys.
# ===============================================================
storage.s3.bucket=${AWS_S3_BUCKET:homespace-file-storage-dev}
storage.s3.region=${AWS_REGION:ap-southeast-1}
storage.s3.upload-url-duration=10m
storage.s3.download-url-duration=5m

# ===============================================================
# OBSERVABILITY
# ===============================================================
## Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
## Logging
logging.level.root=INFO
## Dev Tools
SPRING_DEVTOOLS_ADD_PROPERTIES=false
SPRING_DEVTOOLS_RESTART_ENABLED=false
SPRING_DEVTOOLS_LIVERELOAD_ENABLED=false
