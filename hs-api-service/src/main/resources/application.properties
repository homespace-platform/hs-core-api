# ===============================================================
# CORE APPLICATION
# ===============================================================
server.port=8081
spring.application.name=hs-core-api
spring.output.ansi.enabled=ALWAYS
spring.main.banner-mode=off
spring.threads.virtual.enabled=true

# ===============================================================
# EUREKA SERVER
# ===============================================================
spring.cloud.discovery.enabled=true
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ===============================================================
# INFRASTRUCTURE & DATA
# ===============================================================
## SQL
spring.datasource.url=jdbc:postgresql://localhost:5432/homespace_core
spring.datasource.username=homespace
spring.datasource.password=homespace123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
## JSON Format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
## Kafka
spring.kafka.topic.keycloak-user-events=keycloak-user-events
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
### Keycloak
keycloak.server-url=http://localhost:9000
keycloak.admin.user-name=homespace
keycloak.admin.password=homespace123
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.current-realm=homespace-platform
keycloak.client-id=homespace-id

# ===============================================================
# AWS S3 STORAGE
# Credentials are resolved by the AWS default credential provider chain.
# Local: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY environment variables.
# Production: use an IAM role instead of long-lived access keys.
# ===============================================================
storage.s3.bucket=${AWS_S3_BUCKET:homespace-file-storage-dev}
storage.s3.region=${AWS_REGION:ap-southeast-1}
storage.s3.public-base-url=${STORAGE_PUBLIC_BASE_URL:}
storage.s3.upload-url-duration=10m
storage.s3.download-url-duration=5m

# ===============================================================
# NOTIFICATION & OTP
# dev: OTP is written to the application log and no message is sent.
# Use SPRING_PROFILES_ACTIVE=smtp to send email through Google SMTP.
# ===============================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:homespace123}
spring.data.redis.timeout=2s

# Redis stores short-lived OTP challenges. MongoDB stores delivery audit/history only.
spring.mongodb.uri=${MONGODB_URI:mongodb://homespace:homespace123@localhost:27017/homespace_notification?authSource=admin}

notification.otp.length=6
notification.otp.ttl=3m
notification.otp.resend-cooldown=60s
notification.otp.max-attempts=5
notification.otp.max-sends-per-hour=5
notification.otp.hash-secret=${OTP_HASH_SECRET:change-this-otp-secret-in-production}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notification.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
notification.mail.from-name=${SMTP_FROM_NAME:HomeSpace}

# ===============================================================
# OBSERVABILITY
# ===============================================================
## Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
## Logging
logging.level.root=INFO
## Dev Tools
SPRING_DEVTOOLS_ADD_PROPERTIES=false
SPRING_DEVTOOLS_RESTART_ENABLED=false
SPRING_DEVTOOLS_LIVERELOAD_ENABLED=false
